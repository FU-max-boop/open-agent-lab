name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Probe pinned Codex through native Responses relay
        run: |
          codex_archive=/tmp/codex-0.149.0-linux-x64.tgz
          codex_runtime=/tmp/open-agent-lab-codex-runtime
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --retry 3 --output "$codex_archive" \
            https://registry.npmjs.org/@openai/codex/-/codex-0.149.0-linux-x64.tgz
          CODEX_ARCHIVE="$codex_archive" CODEX_RUNTIME="$codex_runtime" python3 - <<'PY'
          import os
          from benchmarks.terminal_bench.codex_runtime import (
              codex_runtime_spec,
              prepare_tree,
          )

          prepare_tree(
              os.environ["CODEX_ARCHIVE"],
              os.environ["CODEX_RUNTIME"],
              codex_runtime_spec(),
          )
          PY
          userns_clone="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          apparmor_userns="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          restore_userns() {
            status=$?
            trap - EXIT
            [ "$apparmor_userns" != 1 ] || sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=1 || true
            [ "$userns_clone" != 0 ] || sudo sysctl -q -w kernel.unprivileged_userns_clone=0 || true
            exit "$status"
          }
          trap restore_userns EXIT
          [ "$userns_clone" != 0 ] || sudo sysctl -q -w kernel.unprivileged_userns_clone=1
          [ "$apparmor_userns" != 1 ] || sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          OPEN_AGENT_LAB_CODEX_BIN="$codex_runtime/vendor/x86_64-unknown-linux-musl/bin/codex" \
            node --import tsx --test --test-name-pattern="installed Codex" \
            apps/cli/test/codex-runner.test.ts \
            apps/cli/test/codex-route-probe.test.ts

      - name: Validate Harbor 0.22 adapter
        run: |
          python3 -m pip install --disable-pip-version-check harbor==0.22.0 ruff==0.16.4
          python3 -m ruff format --check \
            benchmarks/terminal_bench/codex_runtime.py \
            benchmarks/terminal_bench/experiment_contract.py \
            benchmarks/terminal_bench/failure_classification.py \
            benchmarks/terminal_bench/harbor_agent.py \
            benchmarks/terminal_bench/harbor_environment.py \
            benchmarks/terminal_bench/live_route_probe.py \
            benchmarks/terminal_bench/paired_results.py \
            benchmarks/terminal_bench/relay_evidence.py \
            benchmarks/terminal_bench/test_harbor_agent.py \
            benchmarks/terminal_bench/test_codex_runtime.py \
            benchmarks/terminal_bench/test_harbor_environment.py \
            benchmarks/terminal_bench/test_experiment_contract.py \
            benchmarks/terminal_bench/test_live_route_probe.py \
            benchmarks/terminal_bench/test_paired_results.py \
            benchmarks/terminal_bench/test_validate_harbor_install_only.py \
            benchmarks/terminal_bench/validate_harbor_e2e.py \
            benchmarks/terminal_bench/validate_harbor_install_only.py
          python3 -m ruff check \
            benchmarks/terminal_bench/codex_runtime.py \
            benchmarks/terminal_bench/experiment_contract.py \
            benchmarks/terminal_bench/failure_classification.py \
            benchmarks/terminal_bench/harbor_agent.py \
            benchmarks/terminal_bench/harbor_environment.py \
            benchmarks/terminal_bench/live_route_probe.py \
            benchmarks/terminal_bench/paired_results.py \
            benchmarks/terminal_bench/relay_evidence.py \
            benchmarks/terminal_bench/test_harbor_agent.py \
            benchmarks/terminal_bench/test_codex_runtime.py \
            benchmarks/terminal_bench/test_harbor_environment.py \
            benchmarks/terminal_bench/test_experiment_contract.py \
            benchmarks/terminal_bench/test_live_route_probe.py \
            benchmarks/terminal_bench/test_paired_results.py \
            benchmarks/terminal_bench/test_validate_harbor_install_only.py \
            benchmarks/terminal_bench/validate_harbor_e2e.py \
            benchmarks/terminal_bench/validate_harbor_install_only.py
          python3 -m ruff check --select C901 \
            benchmarks/terminal_bench/codex_runtime.py \
            benchmarks/terminal_bench/experiment_contract.py \
            benchmarks/terminal_bench/failure_classification.py \
            benchmarks/terminal_bench/harbor_agent.py \
            benchmarks/terminal_bench/harbor_environment.py \
            benchmarks/terminal_bench/live_route_probe.py \
            benchmarks/terminal_bench/paired_results.py \
            benchmarks/terminal_bench/relay_evidence.py \
            benchmarks/terminal_bench/validate_harbor_e2e.py \
            benchmarks/terminal_bench/validate_harbor_install_only.py
          python3 -m unittest \
            benchmarks.terminal_bench.test_codex_runtime \
            benchmarks.terminal_bench.test_experiment_contract \
            benchmarks.terminal_bench.test_harbor_agent \
            benchmarks.terminal_bench.test_harbor_environment \
            benchmarks.terminal_bench.test_live_route_probe \
            benchmarks.terminal_bench.test_paired_results \
            benchmarks.terminal_bench.test_validate_harbor_install_only

  task-image-smoke:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned Codex runtime
        env:
          OPEN_AGENT_LAB_CODEX_ARCHIVE: /tmp/codex-0.149.0-linux-x64.tgz
          OPEN_AGENT_LAB_CODEX_RUNTIME: /tmp/open-agent-lab-codex-runtime
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --retry 3 --output "$OPEN_AGENT_LAB_CODEX_ARCHIVE" \
            https://registry.npmjs.org/@openai/codex/-/codex-0.149.0-linux-x64.tgz
          python3 - <<'PY'
          import os
          from benchmarks.terminal_bench.codex_runtime import (
              codex_runtime_spec,
              prepare_tree,
          )

          prepare_tree(
              os.environ["OPEN_AGENT_LAB_CODEX_ARCHIVE"],
              os.environ["OPEN_AGENT_LAB_CODEX_RUNTIME"],
              codex_runtime_spec(),
          )
          PY

      - name: Smoke exact runtime in every frozen task image
        env:
          OPEN_AGENT_LAB_CODEX_RUNTIME: /tmp/open-agent-lab-codex-runtime
        run: |
          install_root=/installed-agent/open-agent-lab/codex-0.149.0-x86_64-unknown-linux-musl
          smoke_command="$(python3 - <<'PY'
          from benchmarks.terminal_bench.codex_runtime import (
              CODEX_RUNTIME_ENTRYPOINT,
              CODEX_RUNTIME_INSTALL_ROOT,
              build_full_tree_verification_command,
              codex_runtime_spec,
          )

          root = CODEX_RUNTIME_INSTALL_ROOT
          commands = [
              build_full_tree_verification_command(codex_runtime_spec()),
              'test -n "$BASH_VERSION"',
              f'test "$({CODEX_RUNTIME_ENTRYPOINT} --version)" = "codex-cli 0.149.0"',
              f'{root}/vendor/x86_64-unknown-linux-musl/codex-path/rg --version >/dev/null',
              f'{root}/vendor/x86_64-unknown-linux-musl/codex-resources/bwrap --version >/dev/null',
              f'if : > {root}/.write-probe 2>/dev/null; then exit 1; fi',
          ]
          print("; ".join(commands))
          PY
          )"
          mapfile -t bindings < <(
            jq --exit-status --raw-output \
              '(.runtime.taskOrder + ["open-agent-lab/live-route-probe"])[] as $task | [$task, .taskRuntimeBindings[$task].immutableImage, .taskRuntimeBindings[$task].imageConfigDigest] | @tsv' \
              benchmarks/terminal_bench/verify-instruction-v1.experiment.json
          )
          # Five frozen pilot tasks plus the dedicated non-scoring route probe.
          test "${#bindings[@]}" -eq 6
          for binding in "${bindings[@]}"; do
            IFS=$'\t' read -r task image config_digest <<<"$binding"
            echo "Smoketesting $task in $image"
            docker pull --platform linux/amd64 "$image"
            identity="$(docker image inspect --format '{{.Id}}|{{.Os}}/{{.Architecture}}' "$image")"
            test "$identity" = "$config_digest|linux/amd64"
            docker run --rm --platform linux/amd64 --pull never --network none \
              --read-only --cap-drop ALL --security-opt no-new-privileges \
              --mount "type=bind,source=$OPEN_AGENT_LAB_CODEX_RUNTIME,target=$install_root,readonly" \
              --entrypoint /bin/bash "$image" -lc "$smoke_command"
          done

  relay-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose overlays
        env:
          OPEN_AGENT_LAB_REPO_ROOT: ${{ github.workspace }}
          OAL_DEEPSEEK_API_KEY_FILE: /tmp/deepseek-provider-key
          OAL_ZAI_API_KEY_FILE: /tmp/zai-provider-key
        run: |
          printf 'services:\n  main:\n    image: busybox:1.37.0\n' > /tmp/base-compose.yaml
          install -m 0600 /dev/null "$OAL_DEEPSEEK_API_KEY_FILE"
          install -m 0600 /dev/null "$OAL_ZAI_API_KEY_FILE"
          docker compose -f /tmp/base-compose.yaml -f benchmarks/terminal_bench/relay.deepseek.compose.yaml config --quiet
          docker compose -f /tmp/base-compose.yaml -f benchmarks/terminal_bench/relay.deepseek.compose.yaml -f benchmarks/terminal_bench/relay.fixture.compose.yaml config --quiet
          docker compose -f /tmp/base-compose.yaml -f benchmarks/terminal_bench/relay.zai.compose.yaml config --quiet

      - name: Exercise isolated relay lifecycle
        env:
          OPEN_AGENT_LAB_REPO_ROOT: ${{ github.workspace }}
          OAL_DEEPSEEK_API_KEY_FILE: /tmp/deepseek-provider-key
        run: |
          printf 'provider-free-ci-key\n' > "$OAL_DEEPSEEK_API_KEY_FILE"
          sudo chown 0:0 "$OAL_DEEPSEEK_API_KEY_FILE"
          sudo chmod 0400 "$OAL_DEEPSEEK_API_KEY_FILE"
          compose=(docker compose -f /tmp/base-compose.yaml -f benchmarks/terminal_bench/relay.deepseek.compose.yaml)
          archive=""
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" ps --all || true
              "${compose[@]}" logs --no-color open-agent-lab-relay || true
            fi
            "${compose[@]}" down --volumes || true
            [ -z "$archive" ] || rm -f "$archive"
            exit "$status"
          }
          trap cleanup EXIT
          set -x
          "${compose[@]}" up --detach --build --wait open-agent-lab-relay
          "${compose[@]}" exec --no-TTY open-agent-lab-relay sh -c \
            'test ! -e /app/apps/cli/relay-dist/.tsbuildinfo && test ! -e /app/apps/cli/relay-dist/relay-fixture-entry.js && test ! -e /app/apps/cli/relay-dist/responses-fixture.js'
          archive="$(mktemp)"
          image_id="$("${compose[@]}" images -q open-agent-lab-relay)"
          docker save --output "$archive" "$image_id"
          forbidden='relay-fixture-entry|responses-fixture|startResponsesFixture|verify-instruction-v1|Before finalizing, perform one focused verification pass'
          if grep -aEq "$forbidden" "$archive"; then
            echo 'Fixture code or experiment instructions are recoverable from the production image layers.' >&2
            exit 1
          fi
          "${compose[@]}" exec --no-TTY --user 1000 open-agent-lab-relay sh -c \
            'test ! -r /run/secrets/provider-api-key'
          "${compose[@]}" exec --no-TTY open-agent-lab-relay sh -c \
            'node -e "const fs=require(\"node:fs\");const value=JSON.parse(fs.readFileSync(\"/var/lib/open-agent-lab/provider-metadata.ndjson.bootstrap-ready\",\"utf8\"));const keys=Object.keys(value).sort().join(\",\");if(keys!==\"buildId,capabilityId,model,provider,schemaVersion\"||value.schemaVersion!==1||value.buildId!==process.env.OAL_EXPECTED_RELAY_BUILD_ID||value.provider!==\"deepseek\"||value.model!==\"deepseek-v4-pro\"||!/^[a-f0-9]{64}$/.test(value.capabilityId))process.exit(1)" && kill -USR1 1'
          "${compose[@]}" exec --no-TTY --user 1000 open-agent-lab-relay sh -c \
            'i=0; while [ ! -f /var/lib/open-agent-lab/provider-metadata.ndjson.client-token ]; do i=$((i+1)); [ "$i" -lt 200 ] || exit 1; sleep 0.1; done; node -e "const fs=require(\"node:fs\");const root=\"/var/lib/open-agent-lab/provider-metadata.ndjson\";const ready=JSON.parse(fs.readFileSync(root+\".bootstrap-ready\",\"utf8\"));const token=JSON.parse(fs.readFileSync(root+\".client-token\",\"utf8\"));if(Object.keys(token).sort().join(\",\")!==\"bearer,capabilityId,schemaVersion\"||token.schemaVersion!==1||token.capabilityId!==ready.capabilityId||!/^[a-f0-9]{64}$/.test(token.bearer))process.exit(1)" && test "$(sed -n "s/^CapEff:[[:space:]]*//p" /proc/1/status)" = 0000000000000000'
          "${compose[@]}" exec --no-TTY --user 1000 open-agent-lab-relay sh -c \
            'kill -USR2 1; i=0; while [ ! -f /var/lib/open-agent-lab/provider-metadata.ndjson.sealed ]; do i=$((i+1)); [ "$i" -lt 150 ] || exit 1; sleep 0.1; done'
          "${compose[@]}" exec --no-TTY --user 1000 open-agent-lab-relay node --input-type=module -e \
            "const fs=await import('node:fs/promises');const relay=await import('/app/apps/cli/relay-dist/responses-relay.js');const build=(await fs.readFile('/app/relay-build-id','utf8')).trim();const seal=relay.verifyRelaySeal(await fs.readFile('/var/lib/open-agent-lab/provider-metadata.ndjson','utf8'),await fs.readFile('/var/lib/open-agent-lab/provider-metadata.ndjson.sealed','utf8'));if(!/^sha256:[a-f0-9]{64}$/.test(build)||seal.buildId!==build)throw new Error('relay build identity mismatch')"

  harbor-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Harbor
        run: python3 -m pip install --disable-pip-version-check harbor==0.22.0

      - name: Run production install-only and provider-free Harbor proofs
        env:
          OPEN_AGENT_LAB_REPO_ROOT: ${{ github.workspace }}
          OPEN_AGENT_LAB_CODEX_ARCHIVE: /tmp/codex-0.149.0-linux-x64.tgz
          OAL_DEEPSEEK_API_KEY_FILE: /run/open-agent-lab/provider-key
          PYTHONPATH: ${{ github.workspace }}
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --retry 3 --output "$OPEN_AGENT_LAB_CODEX_ARCHIVE" \
            https://registry.npmjs.org/@openai/codex/-/codex-0.149.0-linux-x64.tgz
          credential_dir=/run/open-agent-lab
          harbor_gid="$(id -g)"
          test "$harbor_gid" -ne 1000
          sudo install -d -o 0 -g "$harbor_gid" -m 0750 "$credential_dir"
          sudo install -o 0 -g "$harbor_gid" -m 0440 /dev/null "$OAL_DEEPSEEK_API_KEY_FILE"
          openssl rand -hex 32 | sudo tee "$OAL_DEEPSEEK_API_KEY_FILE" >/dev/null
          cleanup_credential() {
            sudo rm -f -- "$OAL_DEEPSEEK_API_KEY_FILE"
            sudo rmdir -- "$credential_dir" 2>/dev/null || true
          }
          trap cleanup_credential EXIT
          prepared_parent="$(mktemp -d)"
          prepared_run="$prepared_parent/source-bound-e2e"
          python3 -m benchmarks.terminal_bench.paired_results prepare \
            "$prepared_run" --replication screen-v1
          export OPEN_AGENT_LAB_REPO_ROOT="$prepared_run/source"
          export PYTHONPATH="$prepared_run/source"
          export PYTHONSAFEPATH=1
          unset PYTHONHOME DEEPSEEK_API_KEY ZAI_API_KEY
          test "$(git -C "$OPEN_AGENT_LAB_REPO_ROOT" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          test -z "$(git -C "$OPEN_AGENT_LAB_REPO_ROOT" status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from benchmarks.terminal_bench import (
              experiment_contract,
              harbor_agent,
              harbor_environment,
          )
          root = Path(os.environ["OPEN_AGENT_LAB_REPO_ROOT"])
          assert Path(experiment_contract.__file__).resolve() == root / "benchmarks/terminal_bench/experiment_contract.py"
          assert Path(harbor_agent.__file__).resolve() == root / "benchmarks/terminal_bench/harbor_agent.py"
          assert Path(harbor_environment.__file__).resolve() == root / "benchmarks/terminal_bench/harbor_environment.py"
          PY
          cd "$OPEN_AGENT_LAB_REPO_ROOT"
          replication="$(jq --exit-status --raw-output '.preflight.replicationId' "$prepared_run/run-record.json")"
          proof_jobs="$prepared_run/install-only-jobs/deepseek"
          proof_name="open-agent-lab-$replication-deepseek-install-only"
          harbor jobs start \
            --config "$prepared_run/configs/deepseek.yaml" \
            --install-only \
            --jobs-dir "$proof_jobs" \
            --job-name "$proof_name" \
            --yes
          if ! cat "$OAL_DEEPSEEK_API_KEY_FILE" | \
            python3 -m benchmarks.terminal_bench.validate_harbor_install_only \
            "$prepared_run" --provider deepseek; then
            find "$proof_jobs/$proof_name" -maxdepth 2 -name result.json -print -exec cat {} \;
            exit 1
          fi
          harbor jobs start --config "$prepared_run/fixtures/harbor-e2e.yaml" --yes
          control_job="$prepared_run/fixture-jobs/harbor-e2e/open-agent-lab-harbor-provider-free-e2e"
          if ! cat "$OAL_DEEPSEEK_API_KEY_FILE" | \
            python3 -m benchmarks.terminal_bench.validate_harbor_e2e "$control_job"; then
            cat "$control_job"/*/artifacts/manifest.json
            exit 1
          fi
          harbor jobs start \
            --config "$prepared_run/fixtures/harbor-verify-instruction-e2e.yaml" \
            --yes
          treatment_job="$prepared_run/fixture-jobs/harbor-verify-instruction-e2e/open-agent-lab-harbor-verify-instruction-e2e"
          if ! cat "$OAL_DEEPSEEK_API_KEY_FILE" | \
            python3 -m benchmarks.terminal_bench.validate_harbor_e2e \
            "$treatment_job" verify-instruction-v1; then
            cat "$treatment_job"/*/artifacts/manifest.json
            exit 1
          fi
